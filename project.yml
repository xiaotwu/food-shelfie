name: Shelfie
options:
  bundleIdPrefix: com.xiaotwu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  knownRegions: [en, en-US, zh-Hans, zh-CN, Base]
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_PREVIEWS: "YES"
    ENABLE_ON_DEMAND_RESOURCES: "NO"
    DEVELOPMENT_TEAM: "9URWGD9Q86"
    CODE_SIGN_STYLE: Automatic
targets:
  Shelfie:
    type: application
    platform: iOS
    sources:
      - path: Shelfie
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.shelfie
        INFOPLIST_FILE: Shelfie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shelfie/Shelfie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_TESTABILITY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: ShelfieWidgets
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - ShelfieTests
  ShelfieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ShelfieWidgets
      - path: Shared
        includes:
          - AppGroup.swift
          - Domain.swift
          - L10n.swift
          - Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.shelfie.widgets
        INFOPLIST_FILE: ShelfieWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShelfieWidgets/ShelfieWidgets.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  ShelfieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShelfieTests
      - path: release/qa/fixtures
        includes:
          - "*.json"
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.shelfie.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shelfie.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Shelfie"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Shelfie
  ShelfieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShelfieUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaotwu.shelfie.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Shelfie
        BUNDLE_LOADER: ""
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: "9URWGD9Q86"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "$(TARGET_NAME)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
    dependencies:
      - target: Shelfie

schemes:
  Shelfie:
    build:
      targets:
        Shelfie: all
        ShelfieWidgets: all
        ShelfieTests: [test]
    test:
      targets:
        - ShelfieTests

  ShelfieLayout:
    build:
      targets:
        Shelfie: all
        ShelfieUITests: [test]
    test:
      targets:
        - ShelfieUITests
