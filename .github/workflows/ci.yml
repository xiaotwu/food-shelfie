name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          echo "Generated Shelfie.xcodeproj"

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild \
            -project Shelfie.xcodeproj \
            -scheme Shelfie \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Run tests (unsigned)
        run: |
          SIM_NAME="iPhone 16"
          xcodebuild \
            -project Shelfie.xcodeproj \
            -scheme Shelfie \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test
